openapi: 3.0.3
info:
  title: BrickHub Google Shopping Product API
  version: 1.0.0
  description: >-
    Endpoint privado independiente de búsqueda. Máximo4MiB upstream y5MiB proxy completo; timeout
    total menor30s. Propiedades conocidas validadas; desconocidas omitidas. Credenciales privadas
    nunca se devuelven.
paths:
  /v1/shopping/product:
    get:
      operationId: getShoppingProduct
      summary: Consultar detalles y tiendas de un catálogo elegido
      security:
        - CognitoAccessToken: []
      parameters:
        - name: catalog_id
          in: query
          required: true
          description: >-
            Identificador regional del catálogo, preservado como cadena tras trim exterior; no todo
            cero. No usar product_id como sustituto.
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^(?=[0-9]*[1-9])[0-9]{1,100}$
        - name: q
          in: query
          required: true
          description: >-
            Texto de búsqueda, tras quitar espacios exteriores. Un valor repetido o vacío es
            inválido.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: hl
          in: query
          required: false
          description: Idioma; conservar valores explícitos. Un valor repetido o vacío es inválido.
          schema:
            type: string
            default: es-mx
            pattern: ^[A-Za-z]{2,3}(-[A-Za-z]{2})?$
        - name: gl
          in: query
          required: false
          description: País de contexto. Un valor repetido o vacío es inválido.
          schema:
            type: string
            default: mx
            pattern: ^[A-Za-z]{2}$
        - name: google_domain
          in: query
          required: false
          description: >-
            Dominio de Google, validación sintáctica case-insensitive. Un valor repetido o vacío es
            inválido.
          schema:
            type: string
            default: google.com.mx
            pattern: >-
              ^[Gg][Oo][Oo][Gg][Ll][Ee]\.(?:[Cc][Oo][Mm]|[A-Za-z]{2}|(?:[Cc][Oo][Mm]|[Cc][Oo])\.[A-Za-z]{2})$
        - name: location
          in: query
          required: false
          description: Ubicación sin caracteres de control. Un valor repetido o vacío es inválido.
          schema:
            type: string
            default: Mexico
            minLength: 1
            maxLength: 200
            pattern: ^[^\u0000-\u001F\u007F-\u009F]+$
      responses:
        '200':
          description: >-
            Detalles validados; stores puede ser vacío; conserva campos opcionales y null. Sin éxito
            parcial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingProductSuccessResponse'
