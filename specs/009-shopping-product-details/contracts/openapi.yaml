        '400':
          description: Query inválida; nombres desconocidos, vacíos y duplicados se rechazan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Bearer ausente/inválido. Gateway puede rechazar antes de Lambda con su formato nativo.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/GatewayUnauthorized'
        '429':
          description: Límite del proveedor; no se reintenta automáticamente.
          headers:
            Retry-After:
              description: Segundos de espera, solo si proveedor aporta un valor válido.
              schema:
                type: integer
                minimum: 1
                maximum: 86400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Fallo interno o secreto no disponible; mensaje saneado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: >-
            Proveedor no disponible, timeout, producto malformado, expansión parcial anunciada o
            tamaño excesivo; sin datos parciales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: >-
        El consumidor llama después de búsqueda con el catálogo del mismo mercado. Una consulta por
        producto; load_all_stores y more_stores fijos true no son parámetros públicos. Query
        desconocida o repetida devuelve400. Resultado parcial anunciado por proveedor devuelve502.
        No se sigue paginación ni se consultan alternativas.
components:
  securitySchemes:
    CognitoAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Token de sesión emitido por Cognito para BrickHub; usar access token. Gateway valida firma,
        emisor, audiencia y vigencia, sin scopes nuevos.
  schemas:
    ShoppingProductSuccessResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - success
        data:
          $ref: '#/components/schemas/ShoppingProductData'
      required:
        - status
        - data
    ShoppingProductData:
      type: object
      additionalProperties: false
      properties:
        product_results:
          $ref: '#/components/schemas/ProductResults'
        search_parameters:
          $ref: '#/components/schemas/NullableProductSearchParameters'
      required:
        - product_results
    ProductResults:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        product_id:
          type: string
          nullable: true
          minLength: 1
        stores:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingStore'
        more_options:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MoreOption'
        extension_ids:
          $ref: '#/components/schemas/NullableExtensionIds'
        source:
          type: string
          nullable: true
      required:
        - title
        - stores
    ShoppingStore:
      type: object
      additionalProperties: false
      properties:
        position:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
        link:
          type: string
          nullable: true
          format: uri
          pattern: ^https?://
          description: HTTP(S) sin userinfo; parámetros de credencial retirados.
        title:
          type: string
          nullable: true
        tag:
          type: string
          nullable: true
        merchant_id:
          type: string
          nullable: true
          minLength: 1
        logo:
          $ref: '#/components/schemas/NullableShoppingImage'
        thumbnail:
          $ref: '#/components/schemas/NullableShoppingImage'
        rating:
          type: number
          minimum: 0
          nullable: true
          maximum: 5
        reviews:
          type: integer
          minimum: 0
          nullable: true
        price:
          type: string
          nullable: true
        extracted_price:
          type: number
          minimum: 0
          nullable: true
        currency:
          type: string
          nullable: true
        shipping:
          type: string
          nullable: true
        shipping_extracted:
          type: number
          minimum: 0
          nullable: true
        tax_hint:
          type: string
          nullable: true
        total:
          type: string
          nullable: true
        extracted_total:
          type: number
          minimum: 0
          nullable: true
