openapi: 3.0.3
info:
  title: BrickHub Saved Sets Listing API
  version: 1.0.0
  description: Private operation that returns the authenticated user's saved catalog snapshots separated by destination.
paths:
  /v1/saved-sets:
    get:
      summary: List saved sets for the authenticated user
      operationId: listSavedSets
      security: [{ CognitoAccessToken: [] }]
      responses:
        '200':
          description: Saved sets grouped by destination. Both arrays are always present.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedSetsListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    CognitoAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthenticated:
      description: The Bearer JWT is missing or invalid.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    InternalError:
      description: A safe internal retrieval error.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    SavedSetsListResponse:
      type: object
      required: [status, data]
      properties:
        status: { type: string, enum: [success] }
        data:
          type: object
          additionalProperties: false
          required: [collection, wishlist]
          properties:
            collection:
              type: array
              items: { $ref: '#/components/schemas/SavedSet' }
            wishlist:
              type: array
              items: { $ref: '#/components/schemas/SavedSet' }
    SavedSet:
      type: object
      additionalProperties: false
      required: [destination, set, createdAt, updatedAt]
      properties:
        destination: { type: string, enum: [collection, wishlist] }
        set: { $ref: '#/components/schemas/SetSnapshot' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SetSnapshot:
      type: object
      additionalProperties: false
      required: [setID, number, numberVariant, name, year, theme, category, released, pieces]
      properties:
        setID: { type: integer, minimum: 1 }
        number: { type: string, minLength: 1, maxLength: 64 }
        numberVariant: { type: integer, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 500 }
        year: { type: integer, minimum: 1949, maximum: 2100 }
        theme: { type: string, minLength: 1, maxLength: 200 }
        subtheme: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, minLength: 1, maxLength: 100 }
        released: { type: boolean }
        pieces: { type: integer, minimum: 0 }
        launchDate: { type: string, format: date-time }
        exitDate: { type: string, format: date-time }
        image: { $ref: '#/components/schemas/SetImage' }
        bricksetURL: { type: string, format: uri }
        rating: { type: number, minimum: 0, maximum: 5 }
        ratingCount: { type: integer, minimum: 0 }
        reviewCount: { type: integer, minimum: 0 }
        packagingType: { type: string, minLength: 1, maxLength: 100 }
        barcode: { $ref: '#/components/schemas/Barcode' }
        LEGOCom:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LegoComAvailability'
        lastUpdated: { type: string, format: date-time }
    SetImage:
      type: object
      additionalProperties: false
      required: [thumbnailURL, imageURL]
      properties:
        thumbnailURL: { type: string, format: uri }
        imageURL: { type: string, format: uri }
    Barcode:
      type: object
      additionalProperties: false
      required: [EAN]
      properties:
        EAN: { type: string, pattern: '^[0-9]{8,14}$' }
    LegoComAvailability:
      type: object
      additionalProperties: false
      properties:
        retailPrice: { type: number, minimum: 0 }
        dateFirstAvailable: { type: string, format: date-time }
        dateLastAvailable: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [status, code, message]
      properties:
        status: { type: string, enum: [error] }
        code: { type: string, enum: [UNAUTHENTICATED, INTERNAL_ERROR] }
        message: { type: string }
