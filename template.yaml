AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: BrickHub Mobile backend - ambiente dev

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
  BricksetSecretArn:
    Type: String
    Description: ARN del secreto de Brickset en AWS Secrets Manager
  ScrapeDoSecretArn:
    Type: String
    Description: ARN del secreto existente scrapedo en AWS Secrets Manager
  IosCallbackUrl:
    Type: String
    Description: Callback URL registrado para BrickHub iOS
  CognitoDomainPrefix:
    Type: String
    Description: Prefijo único para el dominio administrado de Cognito

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    MemorySize: 128
    Timeout: 5
    Tracing: Active
    Environment:
      Variables:
        APP_ENV: !Ref Environment

Resources:
  BrickHubApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${BrickHubUserPool}
              audience:
                - !Ref BrickHubIosAppClient

  BrickHubUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub brickhub-${Environment}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: email
          Required: true
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  BrickHubUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref BrickHubUserPool

  BrickHubIosAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref BrickHubUserPool
      ClientName: !Sub brickhub-${Environment}-ios
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: [!Ref IosCallbackUrl]
      LogoutURLs: [!Ref IosCallbackUrl]

  UserDataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub brickhub-${Environment}-user-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  AmazonOfferCardsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub brickhub-${Environment}-amazon-offer-cards
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  SeedAmazonOffersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub brickhub-${Environment}-seed-amazon-offers
      CodeUri: .
      Handler: src/modules/amazon-offers/seed-amazon-offers.handler
      Description: Carga inicial idempotente de cards Amazon
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            Effect: Allow
            Action: dynamodb:PutItem
            Resource: !GetAtt AmazonOfferCardsTable.Arn
      Environment:
        Variables:
          AMAZON_OFFER_CARDS_TABLE_NAME: !Ref AmazonOfferCardsTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/modules/amazon-offers/seed-amazon-offers.ts]
        Minify: true
        Sourcemap: true
        Target: es2022

  SeedAmazonOffersFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/brickhub-${Environment}-seed-amazon-offers
      RetentionInDays: 14

  SeedAmazonOffersPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SeedAmazonOffersFunction
      Principal: cloudformation.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  SeedAmazonOffers:
    Type: Custom::AmazonOfferCatalogSeed
    DependsOn: SeedAmazonOffersPermission
    Properties:
      ServiceToken: !GetAtt SeedAmazonOffersFunction.Arn
      Version: "1"

  GetAmazonOffersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub brickhub-${Environment}-get-amazon-offers
      CodeUri: .
      Handler: src/handlers/get-amazon-offers.handler
      Description: Entrega las cards públicas de ofertas LEGO en Amazon
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            Effect: Allow
            Action: dynamodb:Query
            Resource: !GetAtt AmazonOfferCardsTable.Arn
      Environment:
        Variables:
          AMAZON_OFFER_CARDS_TABLE_NAME: !Ref AmazonOfferCardsTable
      Events:
        GetAmazonOffers:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: GET
            Path: /v1/amazon-offers
            Auth: { Authorizer: CognitoJwtAuthorizer }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/get-amazon-offers.ts]
        Minify: true
        Sourcemap: true
        Target: es2022

  GetAmazonOffersFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/brickhub-${Environment}-get-amazon-offers
      RetentionInDays: 14

  RadarTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub brickhub-${Environment}-radar
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  RadarMediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      Tags:
        - { Key: Environment, Value: !Ref Environment }

  RadarMediaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub brickhub-${Environment}-radar-media
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  RadarMediaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub BrickHub ${Environment} editorial images
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: RadarS3
            DomainName: !GetAtt RadarMediaBucket.RegionalDomainName
            OriginAccessControlId: !Ref RadarMediaOriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: RadarS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate: { CloudFrontDefaultCertificate: true }

  RadarMediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RadarMediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${RadarMediaBucket.Arn}/radar/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${RadarMediaDistribution}
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt RadarMediaBucket.Arn, !Sub '${RadarMediaBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': false } }

  RadarImportPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Attach explicitly to the editorial operator; never to the HTTP Lambda
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:TransactGetItems, dynamodb:TransactWriteItems, dynamodb:DescribeTable]
            Resource: !GetAtt RadarTable.Arn
          - Effect: Allow
            Action: [s3:PutObject, s3:GetObject]
            Resource: !Sub '${RadarMediaBucket.Arn}/radar/*'
          - Effect: Allow
            Action: s3:GetBucketLocation
            Resource: !GetAtt RadarMediaBucket.Arn
          - Effect: Allow
            Action: sts:GetCallerIdentity
            Resource: '*'

  RadarFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub brickhub-${Environment}-radar
      CodeUri: .
      Handler: src/handlers/radar.handler
      Description: Lecturas autenticadas del contenido editorial Radar
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:TransactGetItems]
            Resource: !GetAtt RadarTable.Arn
      Environment:
        Variables:
          RADAR_TABLE_NAME: !Ref RadarTable
          RADAR_MEDIA_BASE_URL: !Sub https://${RadarMediaDistribution.DomainName}
      Events:
        Config:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: GET
            Path: /v1/radar/config
            Auth: { Authorizer: CognitoJwtAuthorizer }
        Posts:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: GET
            Path: /v1/radar/posts
            Auth: { Authorizer: CognitoJwtAuthorizer }
        Featured:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: GET
            Path: /v1/radar/featured
            Auth: { Authorizer: CognitoJwtAuthorizer }
        Detail:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: GET
            Path: /v1/radar/posts/{slug}
            Auth: { Authorizer: CognitoJwtAuthorizer }
        Videos:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: GET
            Path: /v1/radar/videos
            Auth: { Authorizer: CognitoJwtAuthorizer }
        Releases:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: GET
            Path: /v1/radar/releases
            Auth: { Authorizer: CognitoJwtAuthorizer }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/radar.ts]
        Minify: true
        Sourcemap: true
        Target: es2022

  RadarFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/brickhub-${Environment}-radar
      RetentionInDays: 14

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub brickhub-${Environment}-hello
      CodeUri: .
      Handler: src/handlers/hello.handler
      Description: Endpoint inicial para comprobar que BrickHub API funciona
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        Hello:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: GET
            Path: /v1/hello
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/hello.ts
        Minify: true
        Sourcemap: true
        Target: es2022

  HelloFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/brickhub-${Environment}-hello
      RetentionInDays: 14

  SearchSetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub brickhub-${Environment}-search-sets
      CodeUri: .
      Handler: src/handlers/get-sets.handler
      Description: Busca sets de catálogo mediante Brickset
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref BricksetSecretArn
      Environment:
        Variables:
          BRICKSET_SECRET_ARN: !Ref BricksetSecretArn
      Events:
        SearchSets:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: GET
            Path: /v1/sets
            Auth: { Authorizer: CognitoJwtAuthorizer }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/get-sets.ts
        Minify: true
        Sourcemap: true
        Target: es2022

  SearchSetsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/brickhub-${Environment}-search-sets
      RetentionInDays: 14

  SearchShoppingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub brickhub-${Environment}-search-shopping
      CodeUri: .
      Handler: src/handlers/search-shopping.handler
      Description: Busca productos de Google Shopping mediante ScrapeDo
      Timeout: 29
      MemorySize: 256
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref ScrapeDoSecretArn
      Environment:
        Variables:
          SCRAPE_DO_SECRET_ARN: !Ref ScrapeDoSecretArn
      Events:
        SearchShopping:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: GET
            Path: /v1/shopping/search
            Auth: { Authorizer: CognitoJwtAuthorizer }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/search-shopping.ts]
        Minify: true
        Sourcemap: true
        Target: es2022

  SearchShoppingFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/brickhub-${Environment}-search-shopping
      RetentionInDays: 14

  GetShoppingProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub brickhub-${Environment}-get-shopping-product
      CodeUri: .
      Handler: src/handlers/get-shopping-product.handler
      Description: Consulta detalles y tiendas de Google Shopping mediante ScrapeDo
      Timeout: 29
      MemorySize: 256
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref ScrapeDoSecretArn
      Environment:
        Variables:
          SCRAPE_DO_SECRET_ARN: !Ref ScrapeDoSecretArn
      Events:
        GetShoppingProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: GET
            Path: /v1/shopping/product
            Auth: { Authorizer: CognitoJwtAuthorizer }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/get-shopping-product.ts]
        Minify: true
        Sourcemap: true
        Target: es2022

  GetShoppingProductFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/brickhub-${Environment}-get-shopping-product
      RetentionInDays: 14

  CollectionSetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub brickhub-${Environment}-collection-sets
      CodeUri: .
      Handler: src/handlers/collection-sets.handler
      Description: CRUD privado de colección LEGO
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            Effect: Allow
            Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:DeleteItem]
            Resource: !GetAtt UserDataTable.Arn
      Environment:
        Variables:
          USER_DATA_TABLE_NAME: !Ref UserDataTable
      Events:
        ListCollectionSets:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: GET
            Path: /v1/collection/sets
            Auth: { Authorizer: CognitoJwtAuthorizer }
        CreateCollectionSet:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: POST
            Path: /v1/collection/sets
            Auth: { Authorizer: CognitoJwtAuthorizer }
        UpdateCollectionSet:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: PATCH
            Path: /v1/collection/sets/{collectionSetId}
            Auth: { Authorizer: CognitoJwtAuthorizer }
        DeleteCollectionSet:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: DELETE
            Path: /v1/collection/sets/{collectionSetId}
            Auth: { Authorizer: CognitoJwtAuthorizer }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/collection-sets.ts]
        Minify: true
        Sourcemap: true
        Target: es2022

  CollectionSetsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/brickhub-${Environment}-collection-sets
      RetentionInDays: 14

  SaveUserSetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub brickhub-${Environment}-save-user-set
      CodeUri: .
      Handler: src/handlers/save-user-set.handler
      Description: Guarda snapshots privados de sets en colección o wishlist
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            Effect: Allow
            Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:DeleteItem]
            Resource: !GetAtt UserDataTable.Arn
      Environment:
        Variables:
          USER_DATA_TABLE_NAME: !Ref UserDataTable
      Events:
        ListSavedSets:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: GET
            Path: /v1/saved-sets
            Auth: { Authorizer: CognitoJwtAuthorizer }
        SaveUserSet:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: POST
            Path: /v1/saved-sets
            Auth: { Authorizer: CognitoJwtAuthorizer }
        DeleteSavedSet:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: DELETE
            Path: /v1/saved-sets/{setID}
            Auth: { Authorizer: CognitoJwtAuthorizer }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/save-user-set.ts]
        Minify: true
        Sourcemap: true
        Target: es2022

  SaveUserSetFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/brickhub-${Environment}-save-user-set
      RetentionInDays: 14

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub brickhub-${Environment}-profile
      CodeUri: .
      Handler: src/handlers/profile.handler
      Description: Perfil privado asociado a la identidad autenticada
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem]
            Resource: !GetAtt UserDataTable.Arn
      Environment:
        Variables:
          USER_DATA_TABLE_NAME: !Ref UserDataTable
      Events:
        GetProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: GET
            Path: /v1/profile
            Auth: { Authorizer: CognitoJwtAuthorizer }
        InitializeProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrickHubApi
            Method: PUT
            Path: /v1/profile
            Auth: { Authorizer: CognitoJwtAuthorizer }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/profile.ts]
        Minify: true
        Sourcemap: true
        Target: es2022

  ProfileFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/brickhub-${Environment}-profile
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: URL base de BrickHub API
    Value: !Sub https://${BrickHubApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  HelloUrl:
    Description: Endpoint de prueba
    Value: !Sub https://${BrickHubApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/hello
  SearchSetsUrl:
    Description: Endpoint de búsqueda de sets
    Value: !Sub https://${BrickHubApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/sets
  SearchShoppingUrl:
    Description: URL de búsqueda protegida en Google Shopping
    Value: !Sub https://${BrickHubApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/shopping/search
  CollectionSetsUrl:
    Description: URL de colección protegida
    Value: !Sub https://${BrickHubApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/collection/sets
  SavedSetsUrl:
    Description: URL para guardar sets protegida
    Value: !Sub https://${BrickHubApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/saved-sets
  ProfileUrl:
    Description: URL de perfil protegido
    Value: !Sub https://${BrickHubApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/profile
  CognitoUserPoolId:
    Description: User Pool para clientes autorizados
    Value: !Ref BrickHubUserPool
  CognitoIosAppClientId:
    Description: App Client público de iOS
    Value: !Ref BrickHubIosAppClient
  UserDataTableName:
    Description: Tabla compartida de perfiles y colecciones de usuario
    Value: !Ref UserDataTable

  ShoppingProductUrl:
    Description: Consulta privada de detalles y tiendas de Google Shopping
    Value: !Sub https://${BrickHubApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/shopping/product
  AmazonOffersUrl:
    Description: Catálogo público de ofertas LEGO en Amazon
    Value: !Sub https://${BrickHubApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/amazon-offers
  RadarTableName:
    Value: !Ref RadarTable
  RadarBaseUrl:
    Value: !Sub https://${BrickHubApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/radar
  RadarMediaBucketName:
    Value: !Ref RadarMediaBucket
  RadarMediaBaseUrl:
    Value: !Sub https://${RadarMediaDistribution.DomainName}
  RadarImportPolicyArn:
    Value: !Ref RadarImportPolicy
